


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Mi Billetera</title>
    <link rel="icon" type="image/png" href="favicon.ico"/>
    
    <style>
        /* Estilos Generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        .nav-link {
            text-decoration: none;
            color: #666;
            font-weight: bold;
            align-self: flex-start;
            margin-bottom: 20px;
        }

        /* Contenedor de la Billetera */
        .wallet-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .wallet-card h1 {
            font-size: 1.2rem;
            margin: 0;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance {
            font-size: 2.5rem;
            margin: 15px 0;
            font-weight: bold;
        }

        /* Contenedor de Botones */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-deposit {
            background-color: #2ecc71;
            color: white;
        }

        .btn-withdraw {
            background-color: #e74c3c;
            color: white;
        }

        .btn-history {
            background-color: #34495e;
            color: white;
        }

        /* Sección de Transacciones */
        .transactions-section {
            width: 100%;
            max-width: 400px;
        }

        .transactions-section h3 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            color: #555;
        }

        .empty-state {
            text-align: center;
            color: #999;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <a class="nav-link" href="index.htm">← Inicio</a>
    
    <div class="wallet-card">
        <h1>Mi Wallet</h1>
        <div class="balance">$0.0</div>
    </div>

    <div class="actions">
        <button class="btn btn-deposit"> Depósito</button>
        <button class="btn btn-withdraw"> Retiro</button>
        <button class="btn btn-history"> Historial</button>
    </div>

    <div class="transactions-section">
        <h3>Transacciones recientes</h3>
        <p class="empty-state">No hay movimientos recientes.</p>
    </div>

</body>
</html>
