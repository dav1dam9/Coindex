

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coindex - UI Registro</title>
    <style>
        /* Paleta de colores Coindex */
        :root {
            --bg-dark: #0f172a;
            --panel-color: #1e293b;
            --accent: #38bdf8;
            --btn-color: #f3cc91;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Botón disparador */
        .btn-abrir {
            padding: 16px 32px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-abrir:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Capa oscura de fondo */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
            z-index: 999;
        }

        .overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Panel Lateral (Frontend puro) */
        .side-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--panel-color);
            z-index: 1000;
            padding: 40px;
            box-sizing: border-box;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .side-panel.abierto {
            transform: translateX(-450px);
        }

        .cerrar-btn {
            align-self: flex-end;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        h2 {
            margin: 20px 0 30px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        /* Inputs Estilizados */
        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .campo input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .campo input:focus {
            outline: none;
            border-color: var(--accent);
            background: #1e293b;
        }

        /* Botón de acción final */
        .btn-accion {
            width: 100%;
            padding: 16px;
            background: var(--btn-color);
            border: none;
            border-radius: 12px;
            color: #4a3721;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-accion:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .link-footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .link-footer span {
            color: var(--accent);
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button class="btn-abrir" id="triggerBtn">Registrarme ahora</button>

    <div class="overlay" id="fondo"></div>

    <div class="side-panel" id="panel">
        <div class="cerrar-btn" id="btnCerrar">&times;</div>
        
        <h2>Crea tu Cuenta</h2>
        
        <div class="form-ui">
            <div class="campo">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Ej: Juan Pérez">
            </div>

            <div class="campo">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="nombre@coindex.com">
            </div>

            <div class="campo">
                <label>Teléfono</label>
                <input type="tel" placeholder="+57 310 000 0000">
            </div>

            <div class="campo">
                <label>Contraseña</label>
                <input type="password" placeholder="Mínimo 8 caracteres">
            </div>

            <button class="btn-accion">CREAR CUENTA</button>
        </div>

        <p class="link-footer">¿Ya tienes cuenta? <span>Inicia Sesión</span></p>
    </div>

    <script>
        // Lógica de interfaz (Frontend)
        const trigger = document.getElementById('triggerBtn');
        const panel = document.getElementById('panel');
        const fondo = document.getElementById('fondo');
        const cerrar = document.getElementById('btnCerrar');

        const alternarPanel = (estado) => {
            if(estado === 'abrir') {
                panel.classList.add('abierto');
                fondo.classList.add('visible');
            } else {
                panel.classList.remove('abierto');
                fondo.classList.remove('visible');
            }
        };

        trigger.addEventListener('click', () => alternarPanel('abrir'));
        cerrar.addEventListener('click', () => alternarPanel('cerrar'));
        fondo.addEventListener('click', () => alternarPanel('cerrar'));
    </script>
</body>
</html>
